<!-- Demonstration of how to use the Fetch API in browser -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>

      fetch("https://jsonplaceholder.typicode.com/todos/1") // using .then()
        .then((response) => response.json()) // here response is a promise and response.json() also returns a promise, and promise requires some time to resolve, .then() wait for the promise to resolve and may also returns a promise
        .then((data) => console.log(data))
        .then(() => console.log("completed fetch")) // not directly console.log() because it will execute immediately without waiting for the previous .then() to complete think it like a .then define functions to be executed when the previous promise is resolved
        .then(() => fetchData())
        .then(() => assignments())
        .catch((error) => console.error("Error fetching data:", error));
      console.log("fetch initiated"); //first executed because fetch is asynchronous

      async function fetchData() { //using async/await
        try {
          console.log("fetch initiated using async/await");
          const response = await fetch(
            "https://jsonplaceholder.typicode.com/todos/1"
          );
          const data = await response.json();
          console.log(data);
          console.log("data title:", data.title);
          console.log("completed fetch using async/await");
        } catch (error) {
          console.error("Error fetching data:", error);
        }
      }

      async function assignments() {
        console.log(".");
        console.log("..");

        console.log("first assignment");
        for (let i = 1; i <= 5; i++) {
          try {
            const response = await fetch(
              `https://jsonplaceholder.typicode.com/todos/${i}`
            );
            const data = await response.json();
            console.log(`Todo ${i}:`, data.title);
          } catch (error) {
            console.error("Error fetching data:", error);
          }
        }

        console.log("second assignment"); //parallel fetching
        const [user, todo] = await Promise.all([ 
          fetch("https://jsonplaceholder.typicode.com/users/1").then((res) =>
            res.json()
          ),
          fetch("https://jsonplaceholder.typicode.com/todos/1").then((res) =>
            res.json()
          ),
        ]);
        console.log("User:", user);
        console.log("Todo:", todo);

        console.log("third assignment"); //sequential fetching based on previous fetch
        let prom = await fetch("https://jsonplaceholder.typicode.com/users/1");
        let dat = await prom.json();
        prom = await fetch(
          `https://jsonplaceholder.typicode.com/users/${dat.id}`
        );
        const idData = await prom.json();
        console.log("User ID:", idData.id);

        console.log("assignments completed");
      }
      
    </script>
  </body>
</html>
